<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai editor</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#FAFAF9;--panel:#FFFFFF;--ink:#0C0A09;--t2:#57534E;--t3:#78716C;--t4:#A8A29E;--line:#E7E5E4;--soft:#F5F5F4;--ring:#D6D3D1;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/20px system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ink);text-decoration:underline 1px;text-underline-offset:3px}
.app{display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 28px;flex-shrink:0;gap:16px}
.brand{display:flex;align-items:baseline;gap:10px;width:260px;flex-shrink:0}
.brand b{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.01em;color:#000}
.brand span{font-size:14px;color:var(--t3)}
.steps{display:flex;gap:6px;padding:4px;background:var(--soft);border-radius:12px}
.step{display:flex;gap:8px;align-items:center;padding:7px 14px;border-radius:9px;border:0;background:none;color:var(--t4);font-size:14px;line-height:18px}
.step i{font-style:normal;font-size:13px}
.step.on{background:#fff;color:#000;font-weight:600;box-shadow:0 1px 2px #0C0A0914}
.step.done{color:var(--t2)}
.step:disabled{cursor:default}
.bars{display:none}
.live{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:8px;align-items:center;justify-content:flex-end;width:260px;flex-shrink:0;font-size:13px;line-height:16px;color:var(--t3);text-align:right}
.live.on{color:var(--ink)}
.live.on::before{content:"";width:8px;height:8px;border-radius:4px;background:var(--ink);flex-shrink:0}
main{flex:1;display:flex;gap:20px;padding:12px 20px 20px;min-height:0}
.col{display:flex;flex-direction:column;flex-shrink:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.grow{flex:1 1 0;min-width:0}
h1{margin:0;font-size:40px;line-height:44px;font-weight:700;letter-spacing:-.025em;color:var(--ink)}
.lede{font-size:16px;line-height:24px;color:var(--t2);margin:14px 0 0}
.h{font-size:15px;line-height:18px;font-weight:600;color:#000}
.sub{color:var(--t2);font-size:14px;line-height:21px}
.muted{color:var(--t3);font-size:13px;line-height:16px}
.faint{color:var(--t4)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.check{width:16px;display:flex;justify-content:center;flex-shrink:0}
.dot{width:7px;height:7px;border-radius:4px;background:var(--ink)}
.ring{width:7px;height:7px;border-radius:4px;border:1.5px solid var(--ring)}
.btn{white-space:nowrap;height:42px;padding:0 22px;border-radius:12px;border:1px solid var(--ink);background:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.dark{background:var(--ink);color:#fff}
.btn.quiet{border-color:var(--line);background:var(--bg);color:var(--t2);font-weight:500;padding:0 18px}
.btn:disabled{opacity:.45;cursor:default}
.wide{width:100%;height:58px;border-radius:14px;font-size:16px}
.input{height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;font:13px/16px var(--mono);color:var(--ink);flex:1;min-width:0}
.input:focus{outline:none;border:1.5px solid var(--ink)}
.small{height:40px;width:96px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:500;color:var(--t2);flex-shrink:0}
.small.dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.lock{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:10px;padding:6px 10px;font-size:13px;line-height:16px;flex-shrink:0}
.krow{display:flex;gap:28px;padding:18px 24px;border-top:1px solid var(--line)}
.krow.focus{background:var(--bg)}
.kl{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
.kr{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding-top:2px}
.kname{font-size:15px;line-height:20px;font-weight:600}
.msg{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:18px;color:var(--t3)}
.msg.ok,.msg.bad{color:var(--ink)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px;border-top:1px solid var(--line);margin-top:auto}
.mono{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12px;line-height:16px;color:var(--t3)}
.big-input{display:flex;align-items:center;gap:10px;height:72px;border:1.5px solid var(--ink);border-radius:14px;background:#fff;padding:0 16px 0 22px}
.big-input input{flex:1;min-width:0;border:0;outline:0;font:20px/26px system-ui,sans-serif;background:none;color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:8px;padding:5px 10px;font-size:14px;line-height:18px;flex-shrink:0;border:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{height:48px;padding:0 20px;border-radius:12px;border:1px solid transparent;background:var(--soft);color:var(--t2);font-size:16px;display:inline-flex;gap:8px;align-items:center}
.chip.on{background:#fff;border:1.5px solid var(--ink);color:var(--ink);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 12px;padding:0 24px}
.tile .pic{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#45403C center/cover no-repeat}
.tile .badge{position:absolute;top:8px;right:8px;background:#fff;border-radius:6px;padding:2px 7px;font-size:13px;font-weight:600;line-height:18px}
.tile .views{position:absolute;left:10px;bottom:9px;color:#fff;font-weight:600;font-size:14px;text-shadow:0 1px 3px #0008}
.tile .cap{display:flex;justify-content:space-between;font-size:13px;color:var(--t2);margin-top:6px}
.tile .cap span:last-child{color:var(--t4)}
.mrow{display:grid;grid-template-columns:134px 1fr;gap:0 0;padding:14px 20px;border-radius:14px}
.mrow .k{color:var(--t3);font-size:14px}
.mrow .v{font-size:17px;line-height:26px;color:var(--t2)}
.mrow.now{background:var(--soft)}
.mrow.now .k{color:var(--ink);font-weight:600}
.mrow.now .v{color:var(--ink)}
.mrow.next .v,.mrow.next .k{color:var(--t4)}
.slist{display:flex;flex-direction:column;gap:13px;font-size:14px;line-height:18px}
.slist .row{gap:12px}
.slist .t{flex:1;color:var(--t2)}
.slist .s{color:var(--t4);font-size:13px}
.slist .cur .t{color:#000;font-weight:600}
.slist .later .t{color:var(--t4)}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;width:166px;flex-shrink:0}
.prog div{height:4px;background:var(--ink)}
.cost{border:1px solid var(--line);border-radius:16px;padding:16px 20px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.cost .between{font-size:14px;color:var(--t2)}
.cost b{color:var(--ink)}
.strip{display:grid;gap:10px;padding:14px 24px;border:1px solid var(--line);border-radius:16px;background:#fff}
.strip .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.strip .bar div{height:6px;background:var(--ink)}
.strip span{font-size:13px;color:var(--t3)}
.strip .cur span{color:#000;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats>div{padding:24px 0 22px 28px;border-left:1px solid var(--line)}
.stats>div:first-child{border-left:0;padding-left:0}
.stats b{display:block;font-size:56px;line-height:60px;font-weight:700;letter-spacing:-.03em}
.stats span{color:var(--t2);font-size:14px}
.facts{display:grid;grid-template-columns:110px 1fr;gap:14px 26px;font-size:15px;line-height:22px}
.facts .k{color:var(--t3);font-size:14px}
.facts .k.b{color:var(--ink);font-weight:600}
.pick{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer}
.box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--ring);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
.pick.on .box{border-color:var(--ink)}
.pick .ttl{font-weight:600;font-size:15px}
.pick:not(.on) .ttl{font-weight:400;color:var(--t2)}
.dash{display:flex;gap:14px;font-size:14px;line-height:19px;color:var(--t2);padding:6px 0}
.dash::before{content:"";width:10px;height:1.5px;background:var(--t3);margin-top:9px;flex-shrink:0}
.prompt{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 28px;border-top:1px solid var(--line)}
.prompt code{font:15px/20px var(--mono);color:#000}
.copy{height:40px;min-width:92px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--t2);flex-shrink:0}
.tool{display:flex;justify-content:space-between;gap:16px;padding:18px 0;border-top:1px solid var(--line)}
.drop{flex:1;border:1.5px dashed var(--ring);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:280px;background:none;width:100%}
.drop.over{border-color:var(--ink);background:#fff}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px}
.seg button{flex:1;height:40px;border:0;border-radius:9px;background:none;color:var(--t3);font-size:15px}
.seg button.on{background:#fff;color:#000;font-weight:600;box-shadow:0 1px 2px #0C0A0914}
.file{display:flex;align-items:center;gap:16px;border:1.5px solid var(--ink);border-radius:16px;padding:14px 20px;background:#fff}
.empty{color:var(--t3);font-size:14px;line-height:21px;padding:24px}
.hide{display:none!important}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media (max-width:760px){
  header{height:auto;flex-wrap:wrap;padding:14px 16px 0;gap:10px}
  .brand{width:auto}.live{width:auto;margin-left:auto}
  .steps{display:none}.bars{display:flex;gap:6px;width:100%}
  .bars div{flex:1;height:4px;border-radius:2px;background:var(--line)}.bars .done{background:var(--t4)}.bars .on{background:var(--ink)}
  main{flex-direction:column;padding:12px 16px 20px}
  .col{width:auto!important;padding:0!important}
  h1{font-size:32px;line-height:36px}
  .krow{flex-direction:column;gap:12px;padding:16px}.kl{width:auto}
  .tiles{grid-template-columns:repeat(2,1fr);padding:0 16px}
  .stats{grid-template-columns:1fr 1fr}.stats>div:nth-child(3){border-left:0;padding-left:0}
  .stats>div:nth-child(n+3){border-top:1px solid var(--line)}.stats b{font-size:40px;line-height:48px}
  .facts{grid-template-columns:1fr;gap:4px}
  .mrow{grid-template-columns:1fr}
  .side,.panel[style*="width:400px"]{width:auto!important}
  .pair{flex-direction:column;gap:20px!important}.thumb{width:160px!important}
  .best{grid-template-columns:1fr!important}
  .live{max-width:60vw;display:block}
  .foot{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><b>ai editor</b><span id="who">first run</span></div>
  <nav class="steps" id="steps"></nav>
  <div class="live" id="live"></div>
  <div class="bars" id="bars"></div>
</header>
<main id="main"></main>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CHECK='<svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.2l2.6 2.6L10 3.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CROSS='<svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const LOCK='<svg width="13" height="13" viewBox="0 0 14 14"><rect x="2.5" y="6" width="9" height="6.5" rx="1.5" fill="none" stroke="#0C0A09" stroke-width="1.4"/><path d="M4.5 6V4.5a2.5 2.5 0 015 0V6" fill="none" stroke="#0C0A09" stroke-width="1.4"/></svg>';
const STEPS=['Setup','Creator','Study','Your skill','Your video'];
const KEYS=[
 {id:'elevenlabs',name:'ElevenLabs',tag:'exact words',text:'Keeps every "um" and false start, so the cut finds your retakes. The free transcriber tidies them away.',cost:'Free plan: a few hours a month',url:'https://elevenlabs.io/app/settings/api-keys'},
 {id:'gemini',name:'Gemini',tag:"reads a creator's look",text:'Names the font, colours and graphics when it studies a creator. Without it Claude looks at the frames, which uses more of your Claude usage.',cost:'Free, no card',url:'https://aistudio.google.com/apikey'},
 {id:'typesafe',name:'TypeSafe',tag:'decides the cut',text:'Its Jev model spots retakes and false starts. Without it Claude reads the whole transcript, which costs several times more usage.',cost:'Under 1 cent a 3-min video',url:'https://console.typesafe.ai/keys'}];
const PARTS=[['captions','Captions'],['pace','Pace'],['graphics','Graphics'],['sound','Sound']];
// creator-teardown quick mode, in order. Claude reports these step names (references/home.md).
const PLAN=['Listed their videos','Downloaded the top 5 and 2 median','Transcribed every word','Measured cuts, zooms and camera moves','Reading captions and faces','Naming graphics','Sound effects and music','Writing the style'];
const VIDEO_PLAN=[['Transcribe every word','about 20 s'],['Cut retakes and pauses','about 1 min'],['You watch the cut and leave notes','review page'],['Captions, zooms and graphics','about 3 min'],['You approve the edit and export','review page']];
let S=null, view=null, ui={keys:{},likes:new Set(['captions','pace']),copy:null,paste:'',look:null,file:null,as:'creator',aspect:'9:16',show:{}};
try{const v=localStorage.getItem('ave-home-view');if(v)view=+v}catch(e){}

async function post(u,b){const r=await fetch(u,{method:'POST',body:JSON.stringify(b||{})});let j={};try{j=await r.json()}catch(e){}return Object.assign(j,{_ok:r.ok})}
const latest=t=>S&&[...S.jobs].reverse().find(j=>j.type===t);
const fmtN=n=>n==null?'':n>=1e6?(n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n);
const mult=x=>(x>=10?Math.round(x):Math.round(x*10)/10)+'x';
const fmtT=s=>s==null?'':`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const secs=s=>s==null?'':s<60?`${s}s`:`${Math.floor(s/60)}m ${String(s%60).padStart(2,'0')}s`;
const PLAT={tiktok:'TikTok',youtube:'YouTube',instagram:'Instagram'};
function go(n){view=n;try{localStorage.setItem('ave-home-view',n)}catch(e){}render()}
function autoView(){
  const td=latest('teardown'),sk=latest('skill'),vd=latest('video');
  if(vd)return 4; if(sk)return 3; if(td&&td.state!=='cancelled')return 2;
  return S.setup_skipped?1:0;
}
function reached(){const a=autoView();return Math.max(a,view??0)}

function header(v){
  const r=reached();
  $('#steps').innerHTML=STEPS.map((s,i)=>`<button class="step ${i===v?'on':i<r||i<v?'done':''}" ${i<=r?'':'disabled'} onclick="go(${i})">${i<v||(i<r&&i!==v)?CHECK:`<i>${i+1}</i>`}${s}</button>`).join('');
  $('#bars').innerHTML=STEPS.map((s,i)=>`<div class="${i===v?'on':i<v?'done':''}"></div>`).join('');
  const td=latest('teardown');
  $('#who').textContent=td&&v>=2?'@'+td.args.handle:v>0&&window.innerWidth<760?`step ${v+1} of 5`:'first run';
  const live=$('#live');let t='',on=false;
  const busy=S.jobs.filter(j=>j.state==='taken'||j.state==='queued').pop();
  const setup=latest('setup');
  if(busy&&busy.state==='queued')t=S.listening?'Claude is picking this up':'Waiting for Claude. Say "edit my video" in Claude Code.';
  else if(busy){const s=busy.steps.at(-1),m=s&&/video \d+ of \d+/.exec(s.detail||'');t=m?`Claude is measuring ${m[0]}`:s?`Claude: ${s.text}`:'Claude is on it';on=true}
  else if(setup&&setup.state==='taken'&&setup.steps.length){t=setup.steps.at(-1).text;on=true}
  else if(v===2&&td&&td.state==='done'){t=`Done in ${secs(Math.round(td.finished-td.started))}`}
  else if(v===4&&td&&td.state==='done'){const sk=latest('skill');t='Style: '+((sk&&sk.result.name)||'@'+td.args.handle)}
  else t=S.listening?'Claude is listening':'';
  live.textContent=t;live.className='live'+(on?' on':'');
}

// ---------------------------------------------------------------- H1
function keyRow(k){
  const st=S.keys[k.id]||{},u=ui.keys[k.id]||{},editing=u.edit||!st.set;
  let right;
  if(!editing)right=`<div class="row" style="gap:8px"><div class="input" style="display:flex;align-items:center;background:var(--bg);color:var(--t2)">••••••••••••••••••••••••</div><button class="small" onclick="ui.keys['${k.id}']={edit:1};render()">Replace</button></div>
    <div class="msg ok">${CHECK}<span>${st.env?'Set from your environment.':u.msg||'Saved. The key works.'}</span></div>`;
  else right=`<div class="row" style="gap:8px"><div class="input" style="display:flex;align-items:center;gap:8px;padding:0 0 0 12px"><input id="k-${k.id}" type="${ui.show[k.id]?'text':'password'}" autocomplete="off" spellcheck="false" placeholder="Paste the key" style="flex:1;min-width:0;border:0;outline:0;font:13px var(--mono);background:none" onkeydown="if(event.key==='Enter')verify('${k.id}')"><button style="border:0;background:none;color:var(--t3);font-size:13px;padding:0 12px" onclick="ui.show['${k.id}']=!ui.show['${k.id}'];swapType('${k.id}')">Show</button></div><button class="small dark" ${u.busy?'disabled':''} onclick="verify('${k.id}')">${u.busy?'Checking':u.bad?'Try again':'Verify'}</button></div>
    ${u.bad?`<div class="msg bad">${CROSS}<span>${esc(u.msg)}</span></div>`:`<div class="msg"><div class="check" style="width:12px"><div class="ring"></div></div><span>Not set. Verify sends one free test request, then saves it.</span></div>`}`;
  return `<div class="krow"><div class="kl"><div class="row" style="gap:8px"><span class="kname">${k.name}</span><span class="muted">${k.tag}</span></div><div style="color:var(--t2)">${k.text}</div><div class="row" style="gap:14px"><span class="muted">${k.cost}</span><a class="muted" style="color:var(--ink)" href="${k.url}" target="_blank" rel="noopener">Get a key</a></div></div><div class="kr">${right}</div></div>`;
}
function swapType(id){const i=$('#k-'+id);if(i)i.type=ui.show[id]?'text':'password'}
async function verify(id){
  const i=$('#k-'+id);const value=i?i.value.trim():'';if(!value)return;
  i.value='';i.blur();   // the value is never kept on the page
  ui.keys[id]={busy:1,edit:1};render();
  const r=await post('/key',{name:id,value});
  ui.keys[id]=r.ok?{msg:r.msg}:{bad:1,edit:1,msg:r.msg||'Not saved.'};await load();render();
}
function h1(){
  const d=S.doctor,rows=d?d.rows:[];const ready=rows.filter(r=>r.ok).length;
  const setup=latest('setup');const sstep=setup&&setup.state==='taken'?setup.steps.at(-1):null;
  const tools=!d?`<div class="muted">Checking this computer...</div>`:rows.map(r=>`<div class="row"><div class="check" style="color:var(--t4)">${r.ok?CHECK:'<div class="dot"></div>'}</div><div style="width:190px;flex-shrink:0;color:${r.ok?'var(--t2)':'#000'};font-weight:${r.ok?400:600}">${esc(r.name)}</div><div class="muted" style="color:${r.ok?'var(--t4)':'var(--t2)'}">${r.ok?esc(r.what):'not ready yet'}</div></div>`).join('')
    +(sstep?`<div class="row" style="padding-left:26px"><div class="prog" style="width:160px"><div style="width:${Math.round((sstep.progress||0)*100)}%"></div></div><span class="muted" style="color:var(--t2)">${esc(sstep.text)}${sstep.progress!=null?' · '+Math.round(sstep.progress*100)+'%':''}</span></div>`:'');
  const missing=rows.length&&ready<rows.length;
  const unset=KEYS.filter(k=>!(S.keys[k.id]||{}).set).map(k=>k.id);
  return `<div class="col" style="width:440px;padding:28px 28px 0 14px;gap:36px">
    <div><h1>Edit like the creators you watch.</h1><p class="lede">Name a creator. The editor measures how they cut, then edits your video the same way. First it needs a few tools on this computer.</p></div>
    <div style="display:flex;flex-direction:column;gap:12px"><div class="between"><span class="h">What the editor needs</span><span class="muted">${d?`free · ${ready} of ${rows.length} ready`:''}</span></div>
    <div style="display:flex;flex-direction:column;gap:9px">${tools}</div>

    <div style="flex:1;min-height:20px"></div>
    <div class="muted" style="font-size:14px;line-height:20px;margin-bottom:14px">Try it on a real video now. Claude uses the skill without you naming it.</div>
    <button class="btn dark wide" ${busy?'disabled':''} onclick="go(4)">Next: drop your video</button>
  </div>`;
}

// ---------------------------------------------------------------- H6
async function upload(f){
  ui.file={name:f.name,label:'Copying it into the project...'};render();
  const r=await fetch('/upload?name='+encodeURIComponent(f.name),{method:'POST',body:f});
  const j=await r.json().catch(()=>({}));ui.file=j.ok?j:{name:f.name,bad:j.msg||'The copy failed.'};render();
}
async function probePath(v){if(!v.trim())return;const j=await post('/probe',{path:v});ui.file=j.ok?j:{name:v,bad:j.msg};render()}
function h6(){
  const td=latest('teardown'),sk=latest('skill'),vd=latest('video'),F=ui.file,R=(vd&&vd.result)||{};
  const hasCreator=td&&td.state==='done';
  const running=vd&&(vd.state==='queued'||vd.state==='taken');
  const plan=vd&&vd.steps.length?vd.steps.map(s=>`<div class="row ${s.done?'':'cur'}"><div class="check" style="color:var(--t4)">${s.done?CHECK:'<div class="dot"></div>'}</div><span class="t">${esc(s.text)}</span><span class="s">${s.done?secs(s.secs):esc(s.detail||'')}</span></div>`).join('')
    :VIDEO_PLAN.map(([t,s])=>`<div class="row later"><div class="check"><div class="ring"></div></div><span class="t" style="color:var(--t2)">${t}</span><span class="s">${s}</span></div>`).join('');
  return `<div class="col grow" style="min-width:0;padding:16px 28px 0 14px">
    <h1>Drop your video.</h1><p class="lede" style="margin-top:10px">A raw take straight off your phone is fine. Retakes and pauses get cut first.</p>
    <button class="drop" id="drop" style="margin-top:28px" onclick="$('#pickf').click()"><div style="width:52px;height:52px;border-radius:26px;background:var(--soft);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 12V3M5 7l4-4 4 4M3 12v3h12v-3" fill="none" stroke="#0C0A09" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="h" style="font-size:17px">Drop a video file here</div><div class="muted" style="font-size:14px">.mov, .mp4 or .mkv · it stays on this computer</div></button>
    <input type="file" id="pickf" accept="video/*,.mov,.mkv" class="hide" onchange="this.files[0]&&upload(this.files[0])">
    ${F?`<div class="file" style="margin-top:20px"><div style="width:32px;height:44px;border-radius:6px;background:#57534E;flex-shrink:0"></div><div class="grow"><div style="font-size:16px;font-weight:500">${esc(F.name)}</div><div class="muted" style="font-size:14px;margin-top:4px;${F.bad?'color:var(--ink)':''}">${esc(F.bad||F.label)}</div></div>${F.ok?`<span class="row" style="gap:6px">${CHECK} Ready</span>`:''}<button style="border:0;background:none;color:var(--t3);font-size:18px" onclick="ui.file=null;render()" aria-label="Remove">×</button></div>`:''}
    <div class="row" style="margin:16px 0 0;gap:16px"><span class="muted" style="font-size:14px;flex-shrink:0">or paste a path</span><input class="input" style="height:42px" placeholder="~/Movies/raw-take.MOV" onchange="probePath(this.value)"></div>
  </div>
  <div class="panel" style="width:400px;flex-shrink:0">
    <div style="padding:24px 24px 22px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)">
      <div class="h">Edit it as</div><div class="seg"><button class="${ui.as==='creator'&&hasCreator?'on':''}" ${hasCreator?'':'disabled'} onclick="ui.as='creator';render()">${hasCreator?'@'+esc(td.args.handle):'No creator yet'}</button><button class="${ui.as!=='creator'||!hasCreator?'on':''}" onclick="ui.as='defaults';render()">My defaults</button></div>
      <div class="h" style="margin-top:8px">For</div><div class="seg">${['9:16','16:9'].map(a=>`<button class="${ui.aspect===a?'on':''}" onclick="ui.aspect='${a}';render()">${a==='9:16'?'Vertical 9:16':'Wide 16:9'}</button>`).join('')}</div>
    </div>
    <div style="padding:22px 24px"><div class="h" style="margin-bottom:14px">What happens next</div><div class="slist">${plan}</div>
      ${R.review_url?`<a class="btn" style="margin-top:20px;text-decoration:none" href="${esc(R.review_url)}" target="_blank" rel="noopener">Open the review page</a>`:`<div class="muted" style="margin-top:18px">You review every round on the review page, in your browser.</div>`}
      ${vd&&vd.state==='failed'?`<div class="msg bad" style="margin-top:12px">${CROSS}<span>${esc(vd.error)}</span></div>`:''}
    </div>
    <div style="flex:1"></div>
    <div style="padding:0 20px 20px;text-align:center"><button class="btn dark wide" ${F&&F.ok&&!running?'':'disabled'} onclick="startCut()">${running?(vd.state==='queued'&&!S.listening?'Waiting for Claude':'Cutting...'):'Start the cut'}</button><div class="muted" style="margin-top:12px;font-size:14px">or say "edit my video" in Claude Code</div></div>
  </div>`;
}
async function startCut(){await queue({type:'video',path:ui.file.path,as:ui.as,aspect:ui.aspect})}

// ---------------------------------------------------------------- render loop
function render(){
  if(!S)return;
  const keep=document.activeElement&&document.activeElement.id,pos=keep&&document.activeElement.selectionStart,val=keep&&document.activeElement.value;
  const auto=autoView();let v=view??auto;
  header(v);
  let html;
  if(v===0)html=h1();else if(v===1)html=h2();
  else if(v===2){const td=latest('teardown');html=!td?`<div class="col grow"><div class="empty">Pick a creator first.</div></div>`:td.state==='done'?h4(td):h3(td)}
  else if(v===3)html=h5();else html=h6();
  $('#main').innerHTML=html;
  if(keep){const e=document.getElementById(keep);if(e&&'value' in e){if(e.type!=='file')e.value=val;e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}
  const d=$('#drop');if(d){d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(f)upload(f)}}
}
async function load(){
  try{const r=await fetch('/state');if(!r.ok)throw 0;S=await r.json()}catch(e){$('#live').textContent='The page lost the editor. Run home.py serve again.';return}
  const lk=S.lookup||{};
  if(!ui.look&&lk.handle){ui.look={kind:'creator',handle:lk.handle,platform:lk.platform};if(!ui.paste)ui.paste='@'+lk.handle}
  // typing in a key box: do not redraw under the cursor
  const a=document.activeElement;if(a&&a.id&&a.id.startsWith('k-')&&a.value)return header(view??autoView());
  render();
}
window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());
load();setInterval(load,1500);
</script>
</body>
